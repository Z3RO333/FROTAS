# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - GestaoFrotas

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Garante que só um deploy roda por vez — cancela o anterior se houver novo push
concurrency:
  group: deploy-gestaofrotas
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_82331B84C41D4FE09F124159695BA0BC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E312B6B2EEAD4A0D9A75B694A78BD382 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_EA32FCFFB814440880A0CD85993C5AA4 }}

      - name: Stop App Service before deploy (limpa lock do Oryx)
        run: az webapp stop --name GestaoFrotas --resource-group RGDIROPERACIONAL

      - name: Create deployment ZIP
        run: |
          zip -r deploy.zip . \
            --exclude "*.git*" \
            --exclude ".github/*" \
            --exclude ".next/*" \
            --exclude "node_modules/*"

      - name: Deploy via Azure CLI (evita 409 do OneDeploy)
        run: |
          az webapp deploy \
            --name GestaoFrotas \
            --resource-group RGDIROPERACIONAL \
            --src-path deploy.zip \
            --type zip \
            --async false

      - name: Start App Service
        if: always()
        run: az webapp start --name GestaoFrotas --resource-group RGDIROPERACIONAL
